name: Nextflow CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NXF_VER: '25.04.8'
      NXF_ANSI_LOG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version
      - name: Validate test profile
        run: nextflow config -profile test
      - name: Generate deterministic tiny paired-end FASTQs
        run: python3 tests/make_ci_reads.py
      - name: Execute pipeline with containers
        run: |
          nextflow run main.nf -profile test -c conf/ci.config \
            --reads "${PWD}/tests/ci_data/*_{R1,R2}.fastq.gz" \
            --outdir "${PWD}/results/ci" -with-trace -ansi-log false
      - name: Check expected process outputs
        run: |
          test -d results/fastqc
          test -d results/fastp
          # BAM, BAI and flagstat are currently emitted but not published.
          find work -name '*.bam' -type f -size +0c | grep .
          find work -name '*.bai' -type f -size +0c | grep .
          find work -name '*.flagstat' -type f -size +0c | grep .
      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-logs
          path: |
            .nextflow.log
            .nextflow.log.*
            .nextflow/history
            results/
          if-no-files-found: ignore
